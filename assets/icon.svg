<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 占位图标:暖纸色书页 + 衬线 M + 页边注竖线。正式图标落地时整体替换本文件,重跑 scripts/make-icons.sh 即可。 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#EDE3CF"/>
    </linearGradient>
  </defs>
  <!-- Big Sur 网格:本体 824×824 居中,圆角 185,四周留透明边距 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/>
  <!-- 页边注竖线(marginalia 意象) -->
  <rect x="724" y="312" width="14" height="400" rx="7" fill="#C95E40"/>
  <!-- 衬线 M,基线手调使视觉居中 -->
  <text x="452" y="708" font-family="Georgia, 'Times New Roman', serif" font-size="560" fill="#2B2520" text-anchor="middle">M</text>
</svg>
