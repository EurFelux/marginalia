[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-yaml" }, { id = "end-of-file-fixer" }]

[[repos]]
repo = "local"
hooks = [
  { id = "lint", name = "lint", language = "system", entry = "pnpm lint:fix", pass_filenames = false },
  { id = "format", name = "format", language = "system", entry = "pnpm format", pass_filenames = false },
]
