packages:
  - "packages/*"
  - "!packages/ui-prototype"

# pnpm 11+ 的设置新家（v11 不再读 package.json 的 "pnpm" 字段，也不读 .npmrc 的多数设置）。
# nodeLinker: hoisted —— Electron Forge 系统预检（@electron-forge/cli check-system.ts 跑
#   `pnpm config get node-linker`）强制要求 hoisted；Electron 打包/原生模块需扁平 node_modules，
#   isolated 的 symlink 布局不兼容（`pnpm start` 会被预检拦下）。
# allowBuilds：仅以下原生依赖允许在安装时运行其构建 / postinstall 脚本（true=允许）。
# blockExoticSubdeps: false 允许 @electron/node-gyp 等 git 子依赖。
nodeLinker: hoisted
blockExoticSubdeps: false
allowBuilds:
  electron: true
  electron-winstaller: true
  better-sqlite3: true
  esbuild: true
